<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | Akhilesh Portfolio</title>

    <style>

        body {
            margin: 0;
            font-family: Arial;
            background: #07111f;
            color: white;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 350px;
            background: #0d1c30;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: #55dfff;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 18px;
            box-sizing: border-box;
            border-radius: 7px;
            border: none;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #55dfff;
            font-weight: bold;
            cursor: pointer;
        }

        #message {
            margin-top: 20px;
            text-align: center;
        }

        a {
            color: #55dfff;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>Create Account</h1>

    <form id="registerForm">

        <label>Name</label>

        <input
            type="text"
            id="name"
            required
        >


        <label>Email</label>

        <input
            type="email"
            id="email"
            required
        >


        <label>Password</label>

        <input
            type="password"
            id="password"
            minlength="8"
            required
        >


        <button type="submit">
            Register
        </button>

    </form>

    <div id="message"></div>

    <p>
        Already have an account?
        <a href="login.html">Login</a>
    </p>

</div>


<script>

const form = document.getElementById("registerForm");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;


    try {

        const response = await fetch(
            "https://akhilesh-portfolio-backend-0pos.onrender.com/api/register",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    name,
                    email,
                    password
                })
            }
        );


        const data = await response.json();


        document.getElementById("message").textContent =
            data.message;


    } catch (error) {

        document.getElementById("message").textContent =
            "Cannot connect to server.";

    }

});

</script>

</body>

</html>
